<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>입고 요청서 목록 조회
  </title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>

  <div class="container">

    <!-- header -->
    <header>
      <header class="d-flex flex-wrap align-items-center justify-content-center justify-content-md-between py-3 mb-4 border-bottom">
        <a href="/" class="d-flex align-items-center col-md-3 mb-2 mb-md-0 text-dark text-decoration-none">
          BAOBAB
        </a>
  
        <ul class="nav col-12 col-md-auto mb-2 justify-content-center mb-md-0">
          <li><a href="#" th:href="|@{/api/receiving(status=RECEIVING)}|" class="nav-link px-2 link-primary">입고 관리</a></li>
          <li><a href="#" th:href="|@{/api/shipping(status=PENDING)}|" class="nav-link px-2 link-secondary">출고 관리</a></li>
          <li><a href="#" th:href="|@{/api/goods(status=STORAGE)}|" class="nav-link px-2 link-secondary">물품 관리</a></li>
        </ul>
  
        <div class="col-md-3 text-end">

        </div>
      </header>
    </header>
  
  
  <!-- receiving List -->
    <form action="" th:action="@{/api/receiving}" method="get" class="row">
        <div class="col col-8">
          <select class="form-select" th:name="status" aria-label="Small select example">
            <option value="1" th:each="status: ${receivingStatusList}" th:value="${status.name()}" th:text="${status.status}">One</option>
          </select>
        </div>
        <div class="col">
          <button type="submit"  class="btn btn-secondary">검색</button>
        </div>
      </form>

    <table id="receivingList" class="table">
    <thead>
      <tr>
        <th scope="col">ID</th>
        <th scope="col">카테고리</th>
        <th scope="col">방문 주소</th>
        <th scope="col">방문 날짜</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="receiving : ${receivingList}">
        <th scope="row"><a href="#" th:href="@{|/api/receiving/${receiving.id}|}" th:text="${receiving.id}">1</a></th>
        <td><a href="#" th:href="@{|/api/receiving/${receiving.id}|}" th:text="${receiving.status}">소형가구</a></td>
        <td><a href="#" th:href="@{|/api/receiving/${receiving.id}|}" th:text="${receiving.visitAddress}">소형가구</a></td>
        <td><a href="#" th:href="@{|/api/receiving/${receiving.id}|}" th:text="${#temporals.format(receiving.visitDate, 'yyyy-MM-dd HH:mm:ss')}">소형가구</a></td>
      </tr>
    </tbody>
  </table>
  </div>

</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</html>
