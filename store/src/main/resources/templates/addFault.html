<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> 결함 등록
  </title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>

  <div class="container">

    <!-- header -->
    <header>
      <header class="d-flex flex-wrap align-items-center justify-content-center justify-content-md-between py-3 mb-4 border-bottom">
        <a href="/" class="d-flex align-items-center col-md-3 mb-2 mb-md-0 text-dark text-decoration-none">
          BAOBAB
        </a>
  
        <ul class="nav col-12 col-md-auto mb-2 justify-content-center mb-md-0">
          <li><a href="#" th:href="|@{/api/receiving(status=RECEIVING)}|" class="nav-link px-2 link-secondary">입고 관리</a></li>
          <li><a href="#" th:href="|@{/api/shipping(status=PENDING)}|" class="nav-link px-2 link-secondary">출고 관리</a></li>
          <li><a href="#" th:href="|@{/api/goods(status=STORAGE)}|" class="nav-link px-2 link-primary">물품 관리</a></li>
        </ul>
  
        <div class="col-md-3 text-end">
          
        </div>
      </header>
    </header>
     
    <div class="card d-flex" style="width: 80rem;">
      <div class="card-body">
        <h5 class="card-title">물품 A</h5>
        <h6 class="card-subtitle mb-2 text-muted">Model Name</h6>
        <p class="card-text mt-3">물품 ID : <span> 1 </span></p>
        <p class="card-text">상태 : <span> 입고 진행 중 </span></p>
        <p class="card-text">카테고리 : <span> 소형 가전 </span></p>
        <p class="card-text">수량 : <span> 1 </span></p>
        
        <form id="fileForm" action="#" th:action="@{/api/fault}" method="post" enctype="multipart/form-data">
          <div id="fileScope">
            <div id="fileElement" class="mb-3">
              <div class="mb-3">
                <label for="formFile" class="form-label">결함 사진 추가</label>
                <input class="form-control file" type="file" id="formFile" name="files">
              </div>  
            <label for="caption" class="form-label">결함 내용 입력</label>
            <textarea class="form-control caption" id="caption" rows="3" name="caption"></textarea>
              <input type="hidden" name="goodsId" th:feild="${goodsId}" th:value="${goodsId}">
          </div>
          </div>
          <div class="row">
            <div class="col"></div>
            <div class="col-10">
              
            </div>
            <div class="col">
              <button id="fileBtn" type="button" class="btn btn-secondary w-100">file 추가</button>
            </div>
          </div>
          <button id="submitBtn" type="submit" class="btn btn-danger mt-5 w-100">결함 등록</button>
        </form>

      </div>
    </div>


  </div>

</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script>
  const add_file = () => {
      const box = document.getElementById("fileScope");
      const newP = document.createElement('p');
      newP.innerHTML = "<div id='fileElement' class='mb-3'>" + 
        " <div class='mb-3'>" + 
          " <label for='formFile' class='form-label'>결함 사진 추가</label> " +
          "<input class='form-control' type='file' id='formFile' name='files' >"+
          "</div>" +
          "<label for='exampleFormControlTextarea1' class='form-label'>결함 내용 입력</label>" +
          "<textarea class='form-control' id='exampleFormControlTextarea1' rows='3' name='caption'></textarea>" +
          "</div> <input type='button' class='btn btn-danger mt-3' value='삭제' onclick='remove(this)'>";
      box.appendChild(newP);
  }

  const remove = (obj) => {
      document.getElementById('fileScope').removeChild(obj.parentNode);
  }

  const $fileBtn = document.getElementById('fileBtn');

  $fileBtn.addEventListener('click',add_file);

</script>
</html>
